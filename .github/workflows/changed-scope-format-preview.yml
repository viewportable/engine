name: Changed Scope Format Preview

on:
  push:
    branches:
      - feat/changed-scope-mapping-v1

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run fmt
      - name: Show formatter diff
        run: |
          git diff --             src/changed-scope.ts             test/changed-scope.test.ts             test/config-project-routes.test.ts
