name: AirBnb Wrap Diagnostic

on:
  push:
    branches:
      - engine/wrapping-inline-regression
    paths:
      - scripts/airbnb-wrap-diagnostic.mjs
      - scripts/redecheck-prepare.mjs
      - benchmark/redecheck/sources.json
      - .github/workflows/airbnb-wrap-diagnostic.yml

permissions:
  contents: read

concurrency:
  group: airbnb-wrap-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install npm dependencies
        run: npm ci --ignore-scripts

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Prepare pinned ReDeCheck corpus
        run: npm run benchmark:redecheck:prepare

      - name: Probe AirBnb mobile footer geometry
        run: node scripts/airbnb-wrap-diagnostic.mjs
