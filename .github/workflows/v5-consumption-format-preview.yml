name: V5 Consumption Formatter Preview

on:
  pull_request:
    paths:
      - '.github/workflows/v5-consumption-format-preview.yml'
      - 'scripts/github-repair-policy.mjs'
      - 'scripts/github-summary.mjs'
      - 'test/github-summary.test.mjs'

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Render formatted files
        shell: bash
        run: |
          npm run fmt
          for file in scripts/github-repair-policy.mjs scripts/github-summary.mjs test/github-summary.test.mjs; do
            echo "<<<BEGIN:$file>>>"
            cat "$file"
            echo "<<<END:$file>>>"
          done
