name: Controlled OpenAI Agent E2E

on:
  push:
    branches:
      - manual/openai-agent-e2e-v1
    paths:
      - scripts/openai-agent-e2e.mjs
      - .github/workflows/openai-agent-e2e.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: controlled-openai-agent-e2e
  cancel-in-progress: true

jobs:
  agent-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify OpenAI secret is present
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: test -n "$OPENAI_API_KEY"

      - name: Install npm dependencies
        run: npm ci --ignore-scripts

      - name: Build packaged Engine and MCP server
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run controlled OpenAI agent E2E
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.6-terra
        run: node scripts/openai-agent-e2e.mjs

      - name: Print sanitized acceptance evidence
        if: ${{ always() }}
        run: |
          if [[ -f .slice/openai-agent-e2e/acceptance.json ]]; then
            cat .slice/openai-agent-e2e/acceptance.json
          fi
