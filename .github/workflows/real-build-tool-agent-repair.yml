name: Real Build-Tool Agent Repair

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VIEWPORTABLE_AGENT_MODE: openai
      OPEN_API_TOKEN: ${{ secrets.OPEN_API_TOKEN }}
      OPENAI_MODEL: gpt-5.6

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Require OpenAI API credential
        shell: bash
        run: |
          if [[ -z "$OPEN_API_TOKEN" ]]; then
            echo "OPEN_API_TOKEN repository secret is required"
            exit 1
          fi

      - name: Install Engine dependencies
        run: npm ci --ignore-scripts

      - name: Build Engine
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run real GPT build-tool repair
        run: npm run acceptance:build-tool-agent-repair

      - name: Upload agent repair evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: real-build-tool-agent-repair
          path: .slice/build-tool-agent-repair
          if-no-files-found: warn
          retention-days: 14
