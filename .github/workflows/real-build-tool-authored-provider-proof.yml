name: Real Build Tool Authored Provider Proof

on:
  pull_request:
    paths:
      - 'test/fixtures/build-tool-source-map/src/Candidate.source.scss'
      - '.github/workflows/real-build-tool-authored-provider-proof.yml'

permissions:
  contents: read
  checks: write

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout proof head
        uses: actions/checkout@v7

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install Engine dependencies
        run: npm ci --ignore-scripts

      - name: Build Engine
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run real build-tool acceptance
        run: npm run acceptance:build-tool-source-map

      - name: Publish authored GitHub annotation
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SLICE_EXIT_CODE: '1'
          SLICE_SOURCE_ROOT: ${{ github.workspace }}
        run: |
          node scripts/github-check-run.mjs             .slice/build-tool-source-map-acceptance/evidence/structural-diff.json

      - name: Verify GitHub provider accepted real authored annotation
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          CHECKS="$(
            curl -fsSL               -H "Accept: application/vnd.github+json"               -H "Authorization: Bearer $GITHUB_TOKEN"               -H "X-GitHub-Api-Version: 2022-11-28"               "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/check-runs?per_page=100"
          )"

          EXTERNAL_ID="viewportable-engine:pr:$PR_NUMBER:head:$HEAD_SHA"
          CHECK_ID="$(
            printf '%s' "$CHECKS"               | jq -r --arg external_id "$EXTERNAL_ID"                   '.check_runs[] | select(.name == "Viewportable Engine" and .external_id == $external_id) | .id'               | head -n 1
          )"

          if [[ -z "$CHECK_ID" || "$CHECK_ID" == "null" ]]; then
            echo "Managed Viewportable Engine Check Run not found"
            exit 1
          fi

          printf '%s' "$CHECKS"             | jq -e --argjson id "$CHECK_ID"                 '.check_runs[] | select(.id == $id) | .conclusion == "failure" and .output.annotations_count == 1'

          ANNOTATIONS="$(
            curl -fsSL               -H "Accept: application/vnd.github+json"               -H "Authorization: Bearer $GITHUB_TOKEN"               -H "X-GitHub-Api-Version: 2022-11-28"               "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/check-runs/$CHECK_ID/annotations"
          )"

          printf '%s\n' "$ANNOTATIONS" | jq .
          printf '%s' "$ANNOTATIONS"             | jq -e '
                length == 1
                and .[0].path == "test/fixtures/build-tool-source-map/src/Candidate.source.scss"
                and .[0].start_line == 16
                and .[0].end_line == 16
                and .[0].start_column == 5
                and .[0].end_column == 13
                and .[0].annotation_level == "failure"
                and (.[] | .raw_details | contains("source-map: external"))
              '
