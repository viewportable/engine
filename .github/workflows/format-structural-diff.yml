name: Format Structural Diff

on:
  push:
    branches:
      - engine/structural-diff-v1

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts
      - name: Format structural diff files
        run: npx oxfmt --write src/compare/node-match.ts src/compare/structural-diff.ts src/relationships/containment.ts test/node-match.test.ts test/structural-diff.test.ts
      - name: Upload formatted files
        uses: actions/upload-artifact@v7
        with:
          name: formatted-structural-diff
          path: |
            src/compare/node-match.ts
            src/compare/structural-diff.ts
            src/relationships/containment.ts
            test/node-match.test.ts
            test/structural-diff.test.ts
