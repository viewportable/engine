name: Agent Repair Formatter Preview

on:
  pull_request:
    paths:
      - '.github/workflows/agent-repair-format-preview.yml'
      - 'scripts/build-tool-agent-repair-e2e.mjs'

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Render formatter diff
        shell: bash
        run: |
          npm run fmt
          git diff -- scripts/build-tool-agent-repair-e2e.mjs
