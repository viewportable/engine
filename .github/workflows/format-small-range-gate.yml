name: Format Small Range Gate

on:
  push:
    branches:
      - research/redecheck-small-range-gate

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci --ignore-scripts

      - name: Format gate files
        run: npx oxfmt --write scripts/redecheck-benchmark.mjs test/integration.test.ts

      - name: Upload formatted files
        uses: actions/upload-artifact@v7
        with:
          name: formatted-small-range-gate
          path: |
            scripts/redecheck-benchmark.mjs
            test/integration.test.ts
