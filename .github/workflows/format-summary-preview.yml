name: Format Summary Preview

on:
  push:
    branches:
      - engine/canonical-reporters

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci --ignore-scripts

      - name: Format summary
        run: npx oxfmt --write scripts/github-summary.mjs

      - name: Upload formatted summary
        uses: actions/upload-artifact@v7
        with:
          name: formatted-summary
          path: scripts/github-summary.mjs
