name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: slice-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install npm dependencies
        run: npm ci --ignore-scripts

      # Fast deterministic gates first. Browser setup does not start unless these pass.
      - name: Format check
        run: npm run fmt:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

      - name: Validate npm package
        run: npm run validate:package

      - name: Validate release layout
        run: npm run validate:release:current

      # Browser-dependent checks are intentionally last because Chromium setup is expensive.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Integration tests
        run: npm run test:integration

      - name: Smoke test built CLI
        run: npm run smoke

      - name: Demo project
        run: npm run demo

      - name: Responsively visual demo harness
        run: npm run demo:responsively:check

      - name: Start GitHub Action fixture server
        run: |
          node scripts/demo-server.mjs > /tmp/slice-action-server.log 2>&1 &
          echo $! > /tmp/slice-action-server.pid
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/fixed.html >/dev/null; then
              exit 0
            fi
            sleep 0.2
          done
          cat /tmp/slice-action-server.log
          exit 1

      - name: GitHub Action smoke
        uses: ./
        with:
          url: http://127.0.0.1:4173/fixed.html
          out: .slice/action-smoke
          artifact-name: slice-action-smoke
          install-browser: 'false'

      - name: Stop GitHub Action fixture server
        if: ${{ always() }}
        run: |
          if [[ -f /tmp/slice-action-server.pid ]]; then
            kill "$(cat /tmp/slice-action-server.pid)" 2>/dev/null || true
          fi
