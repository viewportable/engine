name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: slice-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install npm dependencies
        run: npm ci --ignore-scripts

      # Fast deterministic gates first. Browser setup does not start unless these pass.
      - name: Format check
        run: npm run fmt:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

      - name: Validate npm package
        run: npm run validate:package

      - name: Validate release layout
        run: npm run validate:release:current

      - name: GitHub App V5 result acceptance
        run: npm run acceptance:github-app-v5-result

      # Browser-dependent checks are intentionally last because Chromium setup is expensive.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Integration tests
        run: npm run test:integration

      - name: MCP golden agent flow
        run: npm run golden:mcp-agent

      - name: Real build-tool source-map acceptance
        run: npm run acceptance:build-tool-source-map

      - name: Agent repair coverage matrix
        run: npm run acceptance:agent-repair-coverage

      - name: Scan repair coverage matrix
        run: npm run acceptance:scan-repair-coverage

      - name: Smoke test built CLI
        run: npm run smoke

      - name: Demo project
        run: npm run demo

      - name: Responsively visual demo harness
        run: npm run demo:responsively:check

      - name: Start GitHub Action fixture server
        run: |
          node scripts/demo-server.mjs > /tmp/slice-action-server.log 2>&1 &
          echo $! > /tmp/slice-action-server.pid
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/fixed.html >/dev/null; then
              exit 0
            fi
            sleep 0.2
          done
          cat /tmp/slice-action-server.log
          exit 1

      - name: GitHub Action smoke
        uses: ./
        with:
          url: http://127.0.0.1:4173/fixed.html
          out: .slice/action-smoke
          artifact-name: slice-action-smoke
          install-browser: 'false'

      - name: GitHub Action project scan
        id: project-action
        continue-on-error: true
        uses: ./
        with:
          url: http://127.0.0.1:4173
          config: examples/github/action-project.config.json
          out: .slice/action-project-smoke
          artifact-name: slice-action-project-smoke
          install-browser: 'false'

      - name: Verify GitHub Action project scan
        env:
          SLICE_PROJECT_OUTCOME: ${{ steps.project-action.outcome }}
          SLICE_PROJECT_EXIT_CODE: ${{ steps.project-action.outputs.exit_code }}
          SLICE_PROJECT_RESULT_PATH: ${{ steps.project-action.outputs.result_path }}
          SLICE_PROJECT_AGENT_EVIDENCE_PATH: ${{ steps.project-action.outputs.agent_evidence_path }}
        run: |
          test "$SLICE_PROJECT_OUTCOME" = "failure"
          test "$SLICE_PROJECT_EXIT_CODE" = "1"
          test "$SLICE_PROJECT_RESULT_PATH" = ".slice/action-project-smoke/project-results.json"
          test "$SLICE_PROJECT_AGENT_EVIDENCE_PATH" = ".slice/action-project-smoke/agent-evidence.json"
          test -f "$SLICE_PROJECT_RESULT_PATH"
          test -f "$SLICE_PROJECT_AGENT_EVIDENCE_PATH"
          test -f ".slice/action-project-smoke/routes/001-fixed.html/results.json"
          test -f ".slice/action-project-smoke/routes/002-broken.html/results.json"
          node <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(
            fs.readFileSync('.slice/action-project-smoke/project-results.json', 'utf8'),
          );
          const evidence = JSON.parse(
            fs.readFileSync('.slice/action-project-smoke/agent-evidence.json', 'utf8'),
          );

          if (report.mode !== 'project-scan') {
            throw new Error(`unexpected project mode: ${report.mode}`);
          }
          if (
            report.summary.routesChecked !== 2 ||
            report.summary.cleanRoutes !== 1 ||
            report.summary.findingRoutes !== 1 ||
            report.summary.infraFailureRoutes !== 0
          ) {
            throw new Error(`unexpected project summary: ${JSON.stringify(report.summary)}`);
          }

          const statuses = Object.fromEntries(report.routes.map((route) => [route.route, route.status]));
          if (statuses['/fixed.html'] !== 'pass' || statuses['/broken.html'] !== 'fail') {
            throw new Error(`unexpected route statuses: ${JSON.stringify(statuses)}`);
          }

          if (evidence.schemaVersion !== 'viewportable.project-agent-evidence.v1') {
            throw new Error(`unexpected project evidence schema: ${evidence.schemaVersion}`);
          }
          if (evidence.routes?.length !== 2) {
            throw new Error(`expected 2 route evidence entries, got ${evidence.routes?.length}`);
          }
          for (const route of evidence.routes) {
            if (route.evidence?.schemaVersion !== 'viewportable.agent-evidence.v5') {
              throw new Error(
                `unexpected nested evidence schema: ${route.evidence?.schemaVersion}`,
              );
            }
          }
          NODE

      - name: GitHub Action changed-scope project scan
        id: changed-scope-action
        uses: ./
        with:
          url: http://127.0.0.1:4173
          config: examples/github/action-project.config.json
          changed-files: |
            src/home/Hero.tsx
          out: .slice/action-changed-scope-smoke
          artifact-name: slice-action-changed-scope-smoke
          install-browser: 'false'

      - name: Verify GitHub Action changed-scope project scan
        env:
          SLICE_SCOPE_EXIT_CODE: ${{ steps.changed-scope-action.outputs.exit_code }}
          SLICE_SCOPE_RESULT_PATH: ${{ steps.changed-scope-action.outputs.result_path }}
        run: |
          test "$SLICE_SCOPE_EXIT_CODE" = "0"
          test "$SLICE_SCOPE_RESULT_PATH" = ".slice/action-changed-scope-smoke/project-results.json"
          test -f ".slice/action-changed-scope-smoke/routes/001-fixed.html/results.json"
          test ! -e ".slice/action-changed-scope-smoke/routes/002-broken.html"
          node <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(
            fs.readFileSync('.slice/action-changed-scope-smoke/project-results.json', 'utf8'),
          );

          if (
            report.scope?.mode !== 'changed' ||
            report.scope?.configuredRoutes !== 2 ||
            report.scope?.selectedRoutes !== 1 ||
            report.scope?.broadened !== false
          ) {
            throw new Error(`unexpected changed scope: ${JSON.stringify(report.scope)}`);
          }

          if (report.routes?.length !== 1 || report.routes[0]?.route !== '/fixed.html') {
            throw new Error(`unexpected scoped routes: ${JSON.stringify(report.routes)}`);
          }

          const reasons = report.routes[0]?.selectionReasons;
          if (
            reasons?.length !== 1 ||
            reasons[0]?.kind !== 'path-match' ||
            reasons[0]?.changedFile !== 'src/home/Hero.tsx' ||
            reasons[0]?.impactPath !== 'src/home/'
          ) {
            throw new Error(`unexpected selection reasons: ${JSON.stringify(reasons)}`);
          }
          NODE

      - name: GitHub Action compare smoke
        id: compare-action
        continue-on-error: true
        uses: ./
        with:
          url: http://127.0.0.1:4173/action-compare-candidate.html
          baseline-url: http://127.0.0.1:4173/action-compare-baseline.html
          config: examples/github/action-compare.config.json
          out: .slice/action-compare-smoke
          artifact-name: slice-action-compare-smoke
          install-browser: 'false'

      - name: Verify GitHub Action compare smoke
        env:
          SLICE_COMPARE_OUTCOME: ${{ steps.compare-action.outcome }}
          SLICE_COMPARE_EXIT_CODE: ${{ steps.compare-action.outputs.exit_code }}
          SLICE_COMPARE_RESULT_PATH: ${{ steps.compare-action.outputs.result_path }}
          SLICE_COMPARE_AGENT_EVIDENCE_PATH: ${{ steps.compare-action.outputs.agent_evidence_path }}
        run: |
          test "$SLICE_COMPARE_OUTCOME" = "failure"
          test "$SLICE_COMPARE_EXIT_CODE" = "1"
          test "$SLICE_COMPARE_RESULT_PATH" = ".slice/action-compare-smoke/structural-diff.json"
          test "$SLICE_COMPARE_AGENT_EVIDENCE_PATH" = ".slice/action-compare-smoke/agent-evidence.json"
          test -f "$SLICE_COMPARE_AGENT_EVIDENCE_PATH"
          node <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(
            fs.readFileSync('.slice/action-compare-smoke/structural-diff.json', 'utf8'),
          );
          const agentEvidence = JSON.parse(
            fs.readFileSync('.slice/action-compare-smoke/agent-evidence.json', 'utf8'),
          );

          if (agentEvidence.schemaVersion !== 'viewportable.agent-evidence.v5') {
            throw new Error(`unexpected agent evidence schema: ${agentEvidence.schemaVersion}`);
          }
          if (agentEvidence.findings?.length !== 2) {
            throw new Error(
              `expected 2 agent evidence findings, got ${agentEvidence.findings?.length}`,
            );
          }
          for (const finding of agentEvidence.findings) {
            if (
              finding.repair?.repairable !== false ||
              finding.repair?.reason !== 'unsupported-finding'
            ) {
              throw new Error(`unexpected repair policy: ${JSON.stringify(finding.repair)}`);
            }
          }

          if (report.summary.introducedRanges !== 2) {
            throw new Error(`expected 2 introduced ranges, got ${report.summary.introducedRanges}`);
          }
          if (report.summary.exactBoundaries !== 4) {
            throw new Error(`expected 4 exact boundaries, got ${report.summary.exactBoundaries}`);
          }
          if (report.findings?.length !== 2) {
            throw new Error(`expected 2 canonical findings, got ${report.findings?.length}`);
          }

          const findingTypes = report.findings.map((finding) => finding.type).sort();
          if (JSON.stringify(findingTypes) !== JSON.stringify(['disappearance', 'reparenting'])) {
            throw new Error(`unexpected finding types: ${JSON.stringify(findingTypes)}`);
          }

          for (const finding of report.findings) {
            if (finding.exactRange?.minWidth !== 350 || finding.exactRange?.maxWidth !== 499) {
              throw new Error(`unexpected finding range: ${JSON.stringify(finding.exactRange)}`);
            }
          }

          for (const range of report.ranges) {
            const boundaries = Object.fromEntries(
              range.boundaries.map((boundary) => [boundary.edge, boundary.boundary]),
            );
            if (boundaries.lower !== 350 || boundaries.upper !== 499) {
              throw new Error(`unexpected boundaries: ${JSON.stringify(boundaries)}`);
            }
          }
          NODE

      - name: Stop GitHub Action fixture server
        if: ${{ always() }}
        run: |
          if [[ -f /tmp/slice-action-server.pid ]]; then
            kill "$(cat /tmp/slice-action-server.pid)" 2>/dev/null || true
          fi
