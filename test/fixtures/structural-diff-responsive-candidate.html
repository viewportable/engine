<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; }
      #row { position: relative; width: 220px; height: 80px; margin: 40px; }
      #first, #second { position: absolute; top: 0; height: 40px; }
      #first { left: 0; width: 120px; }
      #second { left: 120px; width: 100px; }

      @media (min-width: 350px) and (max-width: 499px) {
        #second { left: 100px; width: 140px; }
      }
    </style>
  </head>
  <body>
    <section id="row">
      <div id="first">First</div>
      <div id="second">Second</div>
    </section>
  </body>
</html>
