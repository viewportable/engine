<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    html, body { margin: 0; }
    .clip { width: 100%; overflow-x: hidden; }
    .contents { display: contents; }
    .wide { width: 800px; height: 40px; }
  </style>
</head>
<body>
  <div class="clip">
    <div class="contents">
      <div class="wide">Intentionally clipped through a non-layout DOM ancestor</div>
    </div>
  </div>
</body>
</html>
