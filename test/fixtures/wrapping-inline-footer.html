<!doctype html>

        margin: 0 -5px;
        padding: 0;
        list-style: none;
        text-align: center;
        font: 15px/21px Arial, sans-serif;
      }
      li {
        padding: 0 5px;
        display: inline-block;
      }
    </style>
  </head>
  <body>
    <div class="footer">
      <ul id="mobile-footer">
        <li id="about">About</li>
        <li id="careers">Careers</li>
        <li id="press">Press</li>
        <li id="blog">Blog</li>
        <li id="terms">Terms &amp; Privacy</li>
      </ul>
    </div>

</html>
