name: Viewportable Engine
description: Viewportable Engine responsive validation with machine-readable evidence, job summary, and artifact upload
author: Viewportable

inputs:
  url:
    description: Page or candidate URL to scan
    required: true
  baseline-url:
    description: Optional baseline URL; when set, run structural baseline-vs-candidate comparison
    required: false
    default: ''
  config:
    description: Optional path to slice.config.json
    required: false
    default: ''
  out:
    description: Output directory for Viewportable Engine artifacts
    required: false
    default: .slice
  artifact-name:
    description: GitHub Actions artifact name
    required: false
    default: slice-results
  install-browser:
    description: Install Playwright Chromium and OS dependencies
    required: false
    default: 'true'
  pr-comment:
    description: Standalone Action mode only; create or update one managed pull request comment for structural compare evidence
    required: false
    default: 'false'
  check-run:
    description: Standalone Action mode only; Cloud/App mode must leave this false because the GitHub App owns the Check Run
    required: false
    default: 'false'

outputs:
  exit_code:
    description: Engine CLI exit code (0 clean, 1 findings, 2 scanner/setup failure)
    value: ${{ steps.scan.outputs.exit_code }}
  result_path:
    description: Path to results.json or structural-diff.json
    value: ${{ steps.scan.outputs.result_path }}
  artifact_url:
    description: URL of the uploaded Viewportable Engine artifact when available
    value: ${{ steps.artifact.outputs.artifact-url }}
  comment_url:
    description: URL of the managed pull request evidence comment when available
    value: ${{ steps.pr-comment.outputs.comment_url }}
  check_url:
    description: URL of the managed Viewportable Engine Check Run when available
    value: ${{ steps.check-run.outputs.check_url }}
  check_conclusion:
    description: GitHub Check Run conclusion when available
    value: ${{ steps.check-run.outputs.check_conclusion }}

runs:
  using: composite
  steps:
    - name: Use Node.js 24
      uses: actions/setup-node@v7
      with:
        node-version: '24'

    - name: Prepare Viewportable Engine
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        if [[ ! -d node_modules ]]; then
          npm ci --ignore-scripts
        fi
        if [[ ! -f dist/cli.mjs ]]; then
          npm run build
        fi

    - name: Install Chromium
      if: ${{ inputs.install-browser == 'true' }}
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npx playwright install --with-deps chromium

    - name: Run Viewportable Engine
      id: scan
      shell: bash
      env:
        SLICE_URL: ${{ inputs.url }}
        SLICE_BASELINE_URL: ${{ inputs.baseline-url }}
        SLICE_CONFIG: ${{ inputs.config }}
        SLICE_OUT: ${{ inputs.out }}
      run: |
        args=("$SLICE_URL" "--out" "$SLICE_OUT")
        result_name="results.json"

        if [[ -n "$SLICE_BASELINE_URL" ]]; then
          args+=("--baseline-url" "$SLICE_BASELINE_URL")
          result_name="structural-diff.json"
        fi

        if [[ -n "$SLICE_CONFIG" ]]; then
          args+=("--config" "$SLICE_CONFIG")
        fi

        set +e
        node "$GITHUB_ACTION_PATH/dist/cli.mjs" "${args[@]}"
        code=$?
        set -e

        echo "exit_code=$code" >> "$GITHUB_OUTPUT"
        echo "result_path=$SLICE_OUT/$result_name" >> "$GITHUB_OUTPUT"

    - name: Write job summary
      if: ${{ always() }}
      shell: bash
      env:
        SLICE_RESULT_PATH: ${{ steps.scan.outputs.result_path }}
      run: node "$GITHUB_ACTION_PATH/scripts/github-summary.mjs" "$SLICE_RESULT_PATH"

    - name: Upload Viewportable Engine results
      id: artifact
      if: ${{ always() }}
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ steps.scan.outputs.result_path }}
        if-no-files-found: ignore
        include-hidden-files: true

    - name: Update GitHub Check Run
      id: check-run
      if: ${{ always() && inputs.check-run == 'true' && inputs.baseline-url != '' }}
      continue-on-error: true
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        SLICE_ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        SLICE_EXIT_CODE: ${{ steps.scan.outputs.exit_code }}
      run: node "$GITHUB_ACTION_PATH/scripts/github-check-run.mjs" "${{ steps.scan.outputs.result_path }}"

    - name: Update pull request evidence comment
      id: pr-comment
      if: ${{ always() && inputs.pr-comment == 'true' && inputs.baseline-url != '' }}
      continue-on-error: true
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        SLICE_ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        SLICE_ENGINE_REF: ${{ github.action_ref }}
        SLICE_ENGINE_REPOSITORY: ${{ github.action_repository }}
      run: node "$GITHUB_ACTION_PATH/scripts/github-pr-comment.mjs" "${{ steps.scan.outputs.result_path }}"

    - name: Enforce Viewportable Engine result
      if: ${{ always() }}
      shell: bash
      env:
        SLICE_EXIT_CODE: ${{ steps.scan.outputs.exit_code }}
      run: |
        code="${SLICE_EXIT_CODE:-2}"
        exit "$code"
